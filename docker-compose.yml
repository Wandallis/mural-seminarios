services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mural
      POSTGRES_USER: mural
      POSTGRES_PASSWORD: mural-local
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mural -d mural"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: 3000
      DATABASE_URL: postgres://mural:mural-local@db:5432/mural
      DB_SSL: "false"
      CLOUD_PROVIDER: local
      LOCAL_STORAGE_DIR: /app/uploads
      MAX_UPLOAD_SIZE_BYTES: 10485760
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "3000:3000"
    volumes:
      - local-uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3000
    ports:
      - "5173:80"
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres-data:
  local-uploads:
